# Copy into your own repo as .circleci/config.yml (or merge the job/workflow in).
# Full env var / exit-code / summary.json contract:
# https://github.com/zyvorai/argus/blob/main/docs/tutorials/15-external-cicd-integration.md
#
# `entrypoint: [""]` clears the image's baked-in ENTRYPOINT so CircleCI's own
# step commands (`run:`) execute directly instead of being appended as args to it.
version: 2.1

jobs:
  argus-smoke:
    docker:
      - image: ghcr.io/zyvorai/zyvor-argus:v0.9.2
        entrypoint: [""]
    environment:
      ZYVOR_BASE_URL: https://staging.example.com   # or interpolate a CircleCI context/env var
      ZYVOR_ENV: development                        # "production" enforces ZYVOR_TARGET_ALLOWLIST for private targets
    steps:
      - run:
          name: Run argus smoke tests
          command: argus test exec --grep @smoke
      - store_artifacts:
          path: reports
      - store_artifacts:
          path: test-results

workflows:
  qa:
    jobs:
      - argus-smoke
