apiVersion: batch/v1
kind: CronJob
metadata:
  name: argus-smoke
  labels:
    app: argus
spec:
  schedule: "0 6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: argus
              image: ghcr.io/zyvorai/zyvor-argus:latest
              command: ["argus", "test", "exec"]
              envFrom:
                - configMapRef:
                    name: argus-config
                - secretRef:
                    name: argus-secrets
          restartPolicy: OnFailure
