apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-webhook
  labels:
    app: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus
      component: webhook
  template:
    metadata:
      labels:
        app: argus
        component: webhook
    spec:
      serviceAccountName: argus
      containers:
        - name: argus
          image: ghcr.io/zyvorai/zyvor-argus:latest
          command: ["argus", "serve", "--port", "8080", "--host", "0.0.0.0"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: argus-config
            - secretRef:
                name: argus-secrets
          env:
            - name: ZYVOR_API_TOKENS_FILE
              value: /app/secrets/api-tokens.json
          # generous timeouts: in-pod Playwright runs briefly saturate the CPU
          # limit and must not fail probes (1s default timeout kills the pod)
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 9
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # headroom for dashboard-triggered Playwright runs (Chromium)
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: reports
              mountPath: /app/reports
            - name: api-tokens
              mountPath: /app/secrets
              readOnly: true
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: argus-reports
        - name: api-tokens
          secret:
            secretName: argus-secrets
            items:
              - key: api-tokens.json
                path: api-tokens.json
