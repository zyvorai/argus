[build-system]
# Floor bumped past CVE-2025-47273 (path traversal in setuptools PackageIndex).
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zyvor-argus"
version = "0.9.0"
description = "AI-first autonomous testing, security, and requirements-quality platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyGithub>=2.4",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "kubernetes>=29.0",
    # Transitive floors bumped past known CVEs (pip-audit/trivy): PYSEC-2026-3545/6/7,
    # PYSEC-2026-3552, GHSA-6v7p-g79w-8964 (msgpack, via langgraph-checkpoint).
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "types-PyYAML",
]
knowledge = [
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langchain-qdrant[fastembed]==1.1.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "qdrant-client>=1.15.1,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
    "pypdf>=5.0.0,<7.0.0",
    "orjson>=3.10.0,<4.0.0",
]
mcp = [
    # Pinned below 2.0 — that major restructured mcp.server.fastmcp (module
    # renamed, FastMCP not re-exported the same way) shortly before this was
    # written; stay on the stable, documented 1.x API until 2.x settles.
    "mcp>=1.8,<2.0",
]
# For multi-replica HA: set ZYVOR_STATE_DB to a postgresql://... URL and
# install this extra. MissionControlStore's SQLite implementation stays the
# default (single-replica); PostgresStore (orchestrator/persistence/postgres_store.py)
# implements the identical public interface, selected automatically by
# get_store() based on the URL scheme.
postgres = [
    "psycopg[binary]>=3.2",
]
# Distributed tracing (orchestrator/observability/tracing.py) -- opt-in via
# ZYVOR_OTEL_ENABLED=true. Without this extra installed, tracing() calls are
# safe no-ops (same "dependency-free by default" posture as metrics.py).
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
argus = "orchestrator.cli:main"
argus-knowledge-ingest = "scripts.knowledge_ingest:main"
argus-knowledge-evaluate = "scripts.knowledge_evaluate:main"
argus-mcp = "integrations.mcp.server:main"
# Backward-compat alias for the main CLI only — deprecate after a few releases.
zyvor-qa = "orchestrator.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "agents*", "github_integration*", "knowledge*", "scripts*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently widen enforcement — ruff's
# own implicit default rule set has changed between minor versions (e.g. 0.15 -> 0.16),
# which otherwise turns a clean `ruff check .` into hundreds of new failures overnight.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# cli.py filters warnings before importing heavy modules — imports intentionally follow.
"orchestrator/cli.py" = ["E402"]

[tool.bandit]
# All reviewed and confirmed either false-positive or architecturally inherent to
# what this tool does, not silently ignored:
#   B101 assert_used         - intentional in validation/security-check helpers
#   B105 hardcoded_password_string - matches dict keys like "pass"/"DASHBOARD_SECRET"
#                                     (env var *names*, not credential values)
#   B110/B112 try_except_pass/continue - deliberate graceful degradation when
#                                          optional [knowledge] extras aren't installed
#   B404/B603/B607 subprocess usage  - this tool's whole job is shelling out to
#                                       node/playwright/docker/kubectl/git/openssl
# Real findings (B501 no-cert-verification, B701 autoescape, B608 SQL, B104 bind-all)
# were fixed in code instead of skipped here.
skips = ["B101", "B105", "B110", "B112", "B404", "B603", "B607"]
