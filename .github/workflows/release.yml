name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.0'
        required: true

env:
  IMAGE: ghcr.io/zyvorai/zyvor-argus

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: ref
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ref.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate GitHub Action entrypoint
        run: |
          docker run --rm --entrypoint sh "${{ env.IMAGE }}:${{ steps.ref.outputs.tag }}" \
            -c "test -x /action-entrypoint.sh && echo action-entrypoint.sh OK"

  build-desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: publish-image
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      # Not required for the desktop app to build or run — Rust is the only
      # runtime dependency of the shell itself — but gives the artifact a
      # .venv it can find via the same dev-checkout auto-detection a local
      # `make desktop-build` would use, so this exact build is smoke-tested
      # end to end (spawns a real `argus serve` and hits /health) rather
      # than only compiled.
      - name: Install argus into a .venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e .

      - name: Install desktop dependencies
        run: cd desktop && npm install

      - name: Build desktop app
        run: cd desktop && npm run tauri build

      - name: Smoke-test the built app spawns argus serve
        run: |
          set -euo pipefail
          BIN="desktop/src-tauri/target/release/zyvor-argus-desktop"
          test -x "$BIN"
          "$BIN" > /tmp/desktop-app.log 2>&1 &
          APP_PID=$!

          PORT=""
          for i in $(seq 1 30); do
            PORT=$(grep -oE 'Uvicorn running on http://127\.0\.0\.1:[0-9]+' /tmp/desktop-app.log 2>/dev/null \
              | grep -oE '[0-9]+$' | head -1 || true)
            [ -n "$PORT" ] && break
            sleep 1
          done

          if [ -z "$PORT" ] || ! curl -sf "http://127.0.0.1:$PORT/health" >/dev/null; then
            echo "::error::desktop app never brought up a healthy argus serve"
            cat /tmp/desktop-app.log
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi

          echo "argus serve is up on port $PORT"
          kill "$APP_PID"

      - name: Rename dmg with version
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg \
            "dist/ZyvorArgus-${{ needs.publish-image.outputs.tag }}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: dist/*.dmg

  github-release:
    needs: [publish-image, build-desktop-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-dmg
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-image.outputs.tag }}
          generate_release_notes: true
          files: dist/*.dmg
          body: |
            Image: `ghcr.io/zyvorai/zyvor-argus:${{ needs.publish-image.outputs.tag }}`

            ```bash
            docker pull ghcr.io/zyvorai/zyvor-argus:${{ needs.publish-image.outputs.tag }}
            ```

            macOS desktop app: download the `.dmg` below (unsigned — right-click → Open on first launch). See [Tutorial 17](https://github.com/zyvorai/argus/blob/main/docs/tutorials/17-desktop-app.md) and `desktop/README.md`.
