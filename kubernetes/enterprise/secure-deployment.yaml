apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus
  labels:
    app.kubernetes.io/name: argus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-reader
subjects:
  - kind: ServiceAccount
    name: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: argus
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argus
          image: ghcr.io/zyvorai/zyvor-argus:v0.9.1
          imagePullPolicy: IfNotPresent
          args: ["serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ZYVOR_ENV
              value: production
            - name: ZYVOR_STATE_DB
              value: /app/reports/mission-control.db
            - name: ZYVOR_AGENT_MODE
              value: read_only
            - name: ZYVOR_TARGET_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: argus-config
                  key: target-allowlist
            - name: ZYVOR_API_TOKENS_FILE
              value: /app/secrets/api-tokens.json
          envFrom:
            - configMapRef:
                name: argus-config
            - secretRef:
                name: argus-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: reports
              mountPath: /app/reports
            - name: generated
              mountPath: /app/tests/generated
            - name: fixtures
              mountPath: /app/tests/fixtures
            - name: screenshots
              mountPath: /app/screenshots
            - name: test-results
              mountPath: /app/test-results
            - name: tmp
              mountPath: /tmp
            - name: api-tokens
              mountPath: /app/secrets
              readOnly: true
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: argus-reports
        - name: api-tokens
          secret:
            secretName: argus-secrets
            items:
              - key: api-tokens.json
                path: api-tokens.json
        - name: generated
          emptyDir: {}
        - name: fixtures
          emptyDir: {}
        - name: screenshots
          emptyDir: {}
        - name: test-results
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: argus
spec:
  selector:
    app.kubernetes.io/name: argus
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: argus
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: argus
      app.kubernetes.io/component: control-plane
