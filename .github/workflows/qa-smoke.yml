name: QA Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -e .

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (shard ${{ matrix.shard }}/2)
        run: argus test exec --grep @smoke --shard ${{ matrix.shard }}/2
        env:
          ZYVOR_BASE_URL: https://zyvor.dev
          ENABLE_API_VALIDATION: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            reports/
            test-results/
          retention-days: 14

  multi-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -e .
          npm install
          npx playwright install --with-deps

      - name: Run multi-browser tests
        run: npx playwright test --config=playwright/playwright.config.ts tests/manual --grep @smoke
        env:
          ZYVOR_BASE_URL: https://zyvor.dev
          ENABLE_MULTI_BROWSER: true

      - name: Upload multi-browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multi-browser-report
          path: reports/
          retention-days: 14
